name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Lint, typecheck and test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      HUSKY: "0"
      DATABASE_URL: postgres://miseboard:miseboard@localhost:5432/miseboard_test
      TEST_DATABASE_URL: postgres://miseboard:miseboard@localhost:5432/miseboard_test
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: miseboard
          POSTGRES_PASSWORD: miseboard
          POSTGRES_DB: miseboard_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U miseboard -d miseboard_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Check generated files are up to date
        run: pnpm codegen:check

  e2e:
    name: End-to-end smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      HUSKY: "0"
      DATABASE_URL: postgres://miseboard:miseboard@localhost:5432/miseboard
      COOKIE_SECRET: ci-only-cookie-secret-for-the-e2e-job
      COOKIE_SECURE: "false"
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: miseboard
          POSTGRES_PASSWORD: miseboard
          POSTGRES_DB: miseboard
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U miseboard -d miseboard"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run the smoke test
        run: pnpm e2e

      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results
