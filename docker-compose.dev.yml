services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: miseboard
      POSTGRES_PASSWORD: miseboard
      POSTGRES_DB: miseboard
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U miseboard -d miseboard"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  db-data:
