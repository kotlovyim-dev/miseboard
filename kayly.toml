[build]
dockerfile = "infra/kayly/Dockerfile"

[services.proxy]
command = "sh -c 'SITE_ADDRESS=:8080 ALLOWED_HOST=mise.kaymos.site exec caddy run --config /app/Caddyfile --adapter caddyfile'"
port = 8080
health = "/healthz"
memory = "96m"

[services.web]
command = "node /app/web/apps/web/server.js"
port = 3000
memory = "384m"

[services.api]
command = "sh -c 'cd /app/api && exec node dist/main.js'"
port = 4000
health = "/healthz"
memory = "256m"

[services.reset]
command = "/usr/local/bin/cron.sh"
memory = "192m"

[env]
COOKIE_SECRET = { generate = "base64:32", to = ["api"] }
COOKIE_SECURE = { template = "true", to = ["api"] }
